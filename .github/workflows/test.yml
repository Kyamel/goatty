on: [push, pull_request]
name: Test

# Every job runs inside the flake devShell rather than against apt packages, so
# CI gets the same toolchain, mesa and ImageMagick as a developer's machine.
# That matters most for the render goldens, which are compared pixel for pixel
# and would drift with the graphics stack otherwise.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command go build ./...
      - run: nix develop --command go vet ./...
      - run: nix develop --command go test ./...

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    env:
      CGO_ENABLED: 1
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "^1.26"
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Build macOS binaries
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/goatty-darwin-${{ matrix.arch }}" ./cmd/goatty
          go build -trimpath -o dist/goatty-headless ./cmd/goatty-headless
      - name: Smoke test CLI and PTY
        run: |
          "dist/goatty-darwin-${{ matrix.arch }}" --version
          font_output=$("dist/goatty-darwin-${{ matrix.arch }}" list-fonts)
          test -n "$font_output"
          python3 -c 'import subprocess; subprocess.run(["dist/goatty-headless", "--command", "exit 0\n"], check=True, timeout=20)'
      - uses: actions/upload-artifact@v7
        with:
          name: goatty-darwin-${{ matrix.arch }}-ci
          path: dist/goatty-darwin-${{ matrix.arch }}
          if-no-files-found: error

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command govulncheck ./...

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Both compare against a checked-in baseline of current failures and fail
      # only on new ones. Neither is expected to pass outright.
      - run: nix develop --command ./scripts/esctest.sh
      - run: nix develop --command ./scripts/wraptest.sh

  render:
    name: Render goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command ./scripts/render-golden.sh
      # A render change is meant to be looked at, so keep the diff images.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: render-diff
          path: .cache/render/
