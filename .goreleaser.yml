version: 2

# The X11 headers cgo needs are installed by the release workflow instead of
# here, so that a local `goreleaser build --snapshot` does not try to sudo apt.
before:
    hooks:
    - go mod vendor
builds:
  -
    id: darktile
    main: ./cmd/darktile
    binary: darktile
    ldflags:
    - "-X github.com/liamg/darktile/internal/app/darktile/version.Version={{.Version}}"
    env:
      - GOFLAGS=-mod=vendor
    goos:
      - linux
    goarch:
      - amd64

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

archives:
  -
    formats: [binary]
    name_template: "{{ .Binary}}-{{ .Os }}-{{ .Arch }}"

release:
  prerelease: auto
  github:
    owner: liamg
    name: darktile
