version: 2

# The X11 headers cgo needs are installed by the release workflow instead of
# here, so that a local `goreleaser build --snapshot` does not try to sudo apt.
before:
  hooks:
    - go mod vendor
builds:
  # macOS uses CGO/AppKit and is built natively by release.yml, then attached
  # to the release after this Linux GoReleaser job succeeds.
  - id: darktile
    main: ./cmd/darktile
    binary: darktile
    ldflags:
      - "-X github.com/kyamel/goatty/internal/app/darktile/version.Version={{.Version}}"
    env:
      - GOFLAGS=-mod=vendor
    goos:
      - linux
    goarch:
      - amd64

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Build and CI
      regexp: '^(build|ci)(\(.+\))?!?:'
      order: 3
    # Anything without a conventional commit prefix, including the history
    # inherited from upstream.
    - title: Other
      order: 999

archives:
  - formats: [binary]
    name_template: "{{ .Binary}}-{{ .Os }}-{{ .Arch }}"

# The repository is deliberately not pinned here: GoReleaser infers it from the
# remote, which is what the owner wants and also lets a fork cut its own
# releases instead of failing against someone else's repository.
release:
  prerelease: auto
